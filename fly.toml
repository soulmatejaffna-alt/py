# Fly.io deploy config — Python/Crawl4AI sibling of canonlayer-crawler.
# Run `fly launch --no-deploy` once to claim the app name, then `fly deploy` to ship.
# Set CRAWLER_API_KEY via `fly secrets set CRAWLER_API_KEY=<random-string>`.

app = "canonlayer-crawler-py"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CRAWLER_HEADLESS = "true"
  CRAWLER_MAX_CONCURRENCY = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"
